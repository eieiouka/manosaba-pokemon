name: Rust team evaluation
on:
  pull_request:
    branches: [develop]
    paths: ['rust/examples/team_eval.rs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  team-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/export-rust-data.mjs && git diff --exit-code rust/data.json
      - run: cargo build --release --manifest-path rust/Cargo.toml --example team_eval
      - run: node scripts/check-rust-parity.mjs 200
      - run: cargo run --release --manifest-path rust/Cargo.toml --example team_eval -- /tmp/rust-team-eval 2 analysis/value-rust-1m.json analysis/value-rust-2m.json analysis/value-rust-5m.json analysis/value-rust-10m.json analysis/value-rust-20m.json analysis/value-rust-30m.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-team-evaluation
          path: /tmp/rust-team-eval/
