name: Rust Elo league training
on:
  pull_request:
    branches: [develop]
    paths: ['rust/examples/league.rs', '.github/workflows/rust-league.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  league:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --manifest-path rust/Cargo.toml --example league
      - run: cargo run --release --manifest-path rust/Cargo.toml --example league -- /tmp/league 2 8 100000 analysis/value-rust-1m.json analysis/value-rust-2m.json analysis/value-rust-5m.json analysis/value-rust-10m.json analysis/value-rust-20m.json analysis/value-rust-30m.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-elo-league
          path: /tmp/league/
