name: Anti-stall search benchmark
on:
  pull_request:
    branches: [develop]
    paths: ['rust/examples/anti_stall_search.rs','.github/workflows/selection-league.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth-league:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --release --manifest-path rust/Cargo.toml --example anti_stall_search -- /tmp/anti-stall-search 2 2000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anti-stall-search
          path: /tmp/anti-stall-search/
