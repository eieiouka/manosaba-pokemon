name: Wide-search Elo league
on:
  pull_request:
    branches: [develop]
    paths: ['rust/examples/wide_search_league.rs','.github/workflows/selection-league.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth-league:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --release --manifest-path rust/Cargo.toml --example wide_search_league -- /tmp/wide-search-league 2 4000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-search-league
          path: /tmp/wide-search-league/
